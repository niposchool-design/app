<form action="#" class="flex flex-col gap-md relative z-10" method="POST">
<!-- Email Input -->
<div class="flex flex-col gap-xs">
<label class="font-data-label text-data-label text-on-surface-variant uppercase" for="email">E-mail</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant">mail</span>
<input class="w-full bg-surface-container-low border-2 border-surface-variant rounded-lg pl-xl pr-sm py-sm font-body-md text-on-surface placeholder:text-outline focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors outline-none h-[48px]" id="email" name="email" placeholder="seu@email.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-xs">
<label class="font-data-label text-data-label text-on-surface-variant uppercase" for="password">Senha</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant">lock</span>
<input class="w-full bg-surface-container-low border-2 border-surface-variant rounded-lg pl-xl pr-sm py-sm font-body-md text-on-surface placeholder:text-outline focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors outline-none h-[48px]" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-sm top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary-container transition-colors" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>

                    Entrar
                    <span class="material-symbols-outlined">arrow_forward</span>
</button>
</form>
